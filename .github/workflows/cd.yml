name: CD
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login na GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dzigii/johnny-server:latest

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Debug
        run: |
          tailscale status
          tailscale ping -c 3 100.118.161.59 || true

      - name: Deploy
        run: |
          mkdir -p ~/.ssh